suite: Ignition Failover SealedSecrets
templates:
  - gan-certificates.yaml
  - secrets.yaml
  - ignition-statefulset.yaml
tests:
  # the SealedSecret unseals to <name>-secrets; a separate keystore Secret would hold the ciphertext
  - it: should build the keystore with the unsealed passphrase under SealedSecrets
    set:
      ignition:
        sealedSecrets: true
        secrets:
          GATEWAY_ADMIN_USERNAME: &sealed 
          GATEWAY_ADMIN_PASSWORD: *sealed
          IGNITION_GAN_KEYSTORE_PASSWORD: *sealed
          IGNITION_WEB_KEYSTORE_PASSWORD: *sealed
    asserts:
      - template: gan-certificates.yaml
        hasDocuments:
          count: 3
      - template: gan-certificates.yaml
        documentIndex: 2
        equal:
          path: spec.keystores.pkcs12.passwordSecretRef
          value:
            name: ignition-failover-secrets
            key: IGNITION_GAN_KEYSTORE_PASSWORD
      - template: secrets.yaml
        isKind:
          of: SealedSecret
      - template: secrets.yaml
        equal:
          path: metadata.name
          value: ignition-failover-secrets
      - template: ignition-statefulset.yaml
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: ignition-failover-secrets
                key: IGNITION_GAN_KEYSTORE_PASSWORD

  # the controller unseals all of a SealedSecret or none of it
  - it: should refuse a default left unsealed
    template: secrets.yaml
    set:
      ignition:
        sealedSecrets: true
        secrets:
          GATEWAY_ADMIN_PASSWORD: 
    asserts:
      - failedTemplate:
          errorPattern: "secrets.GATEWAY_ADMIN_USERNAME is not a kubeseal-encrypted value"

  - it: should refuse a short value as not sealed
    template: secrets.yaml
    set:
      ignition:
        sealedSecrets: true
        secrets:
          GATEWAY_ADMIN_USERNAME: 
          GATEWAY_ADMIN_PASSWORD: 
          IGNITION_GAN_KEYSTORE_PASSWORD: AgBy3CIPHERTEXT
          IGNITION_WEB_KEYSTORE_PASSWORD: 
    asserts:
      - failedTemplate:
          errorPattern: "secrets.IGNITION_GAN_KEYSTORE_PASSWORD is not a kubeseal-encrypted value"
