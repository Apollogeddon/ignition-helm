suite: GAN Certificate Rotation CronJob
templates:
  - cronjobs.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when certManager.rotation.enabled is true
    set:
      certManager:
        rotation:
          enabled: true
    asserts:
      - containsDocument:
          kind: CronJob
          apiVersion: batch/v1
          name: ignition-failover-0-gan-rotation
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[0]
          value: /config/scripts/invoke-args.sh
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          value: /config/scripts/prepare-gan-certificates.sh
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false

  - it: should mount the scripts from the Secret they are rendered as
    set:
      certManager:
        rotation:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: config-scripts
            secret:
              secretName: ignition-failover-common-scripts
              defaultMode: 0755

  - it: should create two cronjobs when redundancy is enabled
    set:
      certManager:
        rotation:
          enabled: true
      ignition:
        redundancy:
          enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - matchSnapshot: {}

  - it: should mount the GAN CA and pass the keystore passphrase the script needs
    set:
      certManager:
        rotation:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /run/secrets/ignition-gan-ca
            name: gan-ca
            readOnly: true
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: gan-ca
            secret:
              secretName: ignition-failover-gan-ca
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: ignition-failover-secrets
                key: IGNITION_GAN_KEYSTORE_PASSWORD
