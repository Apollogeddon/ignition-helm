suite: Ignition Failover Passwords and existingSecret
values:
  - values/required.yaml
templates:
  - ignition-statefulset.yaml
  - secrets.yaml
  - gan-certificates.yaml
  - cronjobs.yaml
tests:
  # the chart ships no default passwords
  - it: should refuse to render without the passwords
    template: ignition-statefulset.yaml
    set:
      ignition:
        secrets:
          GATEWAY_ADMIN_PASSWORD: ""
          IGNITION_GAN_KEYSTORE_PASSWORD: ""
          IGNITION_WEB_KEYSTORE_PASSWORD: ""
    asserts:
      - failedTemplate:
          errorPattern: "no default passwords: set ignition.existingSecret to a Secret holding GATEWAY_ADMIN_PASSWORD, IGNITION_GAN_KEYSTORE_PASSWORD, IGNITION_WEB_KEYSTORE_PASSWORD, or set ignition.secrets.GATEWAY_ADMIN_PASSWORD, ignition.secrets.IGNITION_GAN_KEYSTORE_PASSWORD, ignition.secrets.IGNITION_WEB_KEYSTORE_PASSWORD"

  - it: should name only the passwords that are missing
    template: ignition-statefulset.yaml
    set:
      ignition:
        secrets:
          IGNITION_WEB_KEYSTORE_PASSWORD: ""
    asserts:
      - failedTemplate:
          errorPattern: "or set ignition.secrets.IGNITION_WEB_KEYSTORE_PASSWORD \\(e.g. --set ignition.secrets.IGNITION_WEB_KEYSTORE_PASSWORD=<password>, or --set ignition.existingSecret=<secret>\\)"

  - it: should render no Secret of its own with existingSecret
    template: secrets.yaml
    set:
      ignition:
        existingSecret: &existing my-ignition-secrets
        secrets: &blank
          GATEWAY_ADMIN_PASSWORD: ""
          IGNITION_GAN_KEYSTORE_PASSWORD: ""
          IGNITION_WEB_KEYSTORE_PASSWORD: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: should read every password from existingSecret
    template: ignition-statefulset.yaml
    set:
      ignition:
        existingSecret: *existing
        secrets: *blank
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-ignition-secrets
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TLS_KEYSTORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-ignition-secrets
                key: IGNITION_WEB_KEYSTORE_PASSWORD
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: my-ignition-secrets
                key: IGNITION_GAN_KEYSTORE_PASSWORD

  - it: should build the Gateway Network keystore with the existingSecret passphrase
    template: gan-certificates.yaml
    documentIndex: 2
    set:
      ignition:
        existingSecret: *existing
        secrets: *blank
    asserts:
      - equal:
          path: spec.keystores.pkcs12.passwordSecretRef
          value:
            name: my-ignition-secrets
            key: IGNITION_GAN_KEYSTORE_PASSWORD

  - it: should rotate certificates with the existingSecret passphrase
    template: cronjobs.yaml
    set:
      certManager:
        rotation:
          enabled: true
      ignition:
        existingSecret: *existing
        secrets: *blank
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: my-ignition-secrets
                key: IGNITION_GAN_KEYSTORE_PASSWORD

  # a value in secrets would be silently dropped, as the chart renders no Secret
  - it: should refuse secrets values alongside existingSecret
    template: ignition-statefulset.yaml
    set:
      ignition:
        existingSecret: *existing
    asserts:
      - failedTemplate:
          errorPattern: "ignition.secrets.GATEWAY_ADMIN_PASSWORD is set, but ignition.existingSecret \\(my-ignition-secrets\\) replaces the chart's Secret"

  # e.g. a Secret unsealed from the user's own SealedSecret
  - it: should render no SealedSecret with existingSecret and sealedSecrets
    template: secrets.yaml
    set:
      ignition:
        existingSecret: *existing
        sealedSecrets: true
        secrets: *blank
    asserts:
      - hasDocuments:
          count: 0
