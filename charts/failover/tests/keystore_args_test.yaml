suite: Ignition Failover Keystore Passwords
values:
  - values/required.yaml
templates:
  - ignition-statefulset.yaml
tests:
  # the gateway opens the GAN keystore with ignition.metro.keystorePassword, default "metro":
  # without it a pair whose secrets set another password never connects
  - it: should pass the GAN keystore password to the gateway from its secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -Dignition.metro.keystorePassword=$(IGNITION_GAN_KEYSTORE_PASSWORD)
      - notContains:
          path: spec.template.spec.containers[0].args
          content: -Dignition.gateway.ssl.keystorePassword=$(IGNITION_WEB_KEYSTORE_PASSWORD)

  - it: should pass the web keystore password too when ssl is enabled
    set:
      ignition:
        ssl:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -Dignition.gateway.ssl.keystorePassword=$(IGNITION_WEB_KEYSTORE_PASSWORD)

  - it: should keep a keystore password already set in args
    set:
      ignition:
        args: ["--", "-Dignition.metro.keystorePassword=custom"]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: -Dignition.metro.keystorePassword=$(IGNITION_GAN_KEYSTORE_PASSWORD)
      - contains:
          path: spec.template.spec.containers[0].args
          content: -Dignition.metro.keystorePassword=custom

  - it: should add the separator when args have none
    set:
      ignition:
        args: ["-m", 512]
        logging:
          wrapperLogToStdout: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-m", "512", "--", "-Dignition.metro.keystorePassword=$(IGNITION_GAN_KEYSTORE_PASSWORD)"]
