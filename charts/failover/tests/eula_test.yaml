suite: Ignition Failover EULA
values:
  - values/required.yaml
templates:
  - configmap.yaml
tests:
  - it: should accept the EULA when acceptEula is true
    asserts:
      - equal:
          path: data.ACCEPT_IGNITION_EULA
          value: "Y"

  - it: should refuse to render until the EULA is accepted
    set:
      acceptEula: false
    asserts:
      - failedTemplate:
          errorPattern: "you accept it, set acceptEula=true \\(e.g. --set acceptEula=true\\)"

  # "false" from --set-string or a quoted YAML value is not an acceptance
  - it: should refuse anything but true
    set:
      acceptEula: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "Ignition's EULA is not accepted"

  # lets a test (e2e S07) start a gateway that cannot commission
  - it: should let config override the accepted EULA
    set:
      ignition:
        config:
          ACCEPT_IGNITION_EULA: "N"
    asserts:
      - equal:
          path: data.ACCEPT_IGNITION_EULA
          value: "N"
