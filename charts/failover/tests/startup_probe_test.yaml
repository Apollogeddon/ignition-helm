suite: Ignition Failover Startup Probe
templates:
  - ignition-statefulset.yaml
tests:
  - it: should not render a startupProbe by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should render a startupProbe when enabled
    set:
      ignition:
        startupProbe:
          enabled: true
          failureThreshold: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          value: ["health-check.sh", "-t", "5"]
