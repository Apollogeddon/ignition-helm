suite: Ignition Failover GAN Certificates
values:
  - values/required.yaml
templates:
  - gan-certificates.yaml
tests:
  - it: should create GAN CA and Issuer
    asserts:
      - documentIndex: 1
        isKind:
          of: Certificate
      - documentIndex: 1
        matchRegex:
          path: metadata.name
          pattern: -gan-ca$
      - documentIndex: 2
        isKind:
          of: Issuer
      - documentIndex: 2
        matchRegex:
          path: metadata.name
          pattern: -gan-issuer$

  - it: should create GAN Certificate
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 3
        isKind:
          of: Certificate
      - documentIndex: 3
        equal:
          path: metadata.name
          value: ignition-failover-gan

  - it: should take the keystore password from the secret the preconfigure container reads
    asserts:
      - documentIndex: 3
        equal:
          path: spec.keystores.pkcs12.passwordSecretRef
          value:
            name: ignition-failover-secrets
            key: IGNITION_GAN_KEYSTORE_PASSWORD

  - it: should keep the CA key on renewal
    asserts:
      - documentIndex: 1
        equal:
          path: spec.privateKey.rotationPolicy
          value: Never

  - it: should rotate the GAN certificate key on renewal
    asserts:
      - documentIndex: 3
        equal:
          path: spec.privateKey.rotationPolicy
          value: Always

  # Ignition trusts a peer only when the end of its chain is trusted, so the GAN CA is a
  # root of the release's own, never one a cluster CA issuer signs
  - it: should issue the GAN CA from the release's own self-signed issuer
    set:
      certManager:
        issuer:
          name: cluster-ca
          kind: ClusterIssuer
    asserts:
      - documentIndex: 0
        isKind:
          of: Issuer
      - documentIndex: 0
        matchRegex:
          path: metadata.name
          pattern: -gan-selfsigned$
      - documentIndex: 0
        equal:
          path: spec
          value:
            selfSigned: {}
      - documentIndex: 1
        matchRegex:
          path: spec.issuerRef.name
          pattern: -gan-selfsigned$
      - documentIndex: 1
        equal:
          path: spec.issuerRef.kind
          value: Issuer
