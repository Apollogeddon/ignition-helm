suite: Ignition Failover Production Features
templates:
  - networkpolicy.yaml
  - servicemonitor.yaml
  - ignition-statefulset.yaml
tests:
  - it: should create NetworkPolicy when enabled
    template: networkpolicy.yaml
    set:
      ignition:
        networkPolicy:
          enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.policyTypes[0]
          value: Ingress

  - it: should create ServiceMonitor when enabled
    template: servicemonitor.yaml
    set:
      ignition:
        serviceMonitor:
          enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].path
          value: /data/metrics

  - it: should not include a lifecycle hook by default (gwcmd.sh -p resets the login password)
    template: ignition-statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: should render a lifecycle hook from values
    template: ignition-statefulset.yaml
    set:
      ignition:
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "5"]
