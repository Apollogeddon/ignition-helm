# Default values for ignition-failover.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Application name used for naming resources
applicationName: "ignition-failover"

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

image:
  # -- The Docker image repository
  repository: inductiveautomation/ignition
  # -- The Docker image pull policy
  pullPolicy: IfNotPresent
  # -- The Docker image tag (Ignition version)
  tag: ""
  # -- Optional: Secrets for pulling images from private registries
  # imagePullSecrets: []

certManager:
  issuer:
    # -- The name of the cert-manager Issuer or ClusterIssuer
    name: cluster-issuer
    # -- The kind of the cert-manager Issuer (Issuer or ClusterIssuer)
    kind: ClusterIssuer

  # -- Automated Certificate Rotation via Kubernetes CronJob
  rotation:
    enabled: false
    schedule: "0 7 * * *"

  # -- Rolling restart after certificate renewal. The init container copies the
  # GAN and web certificates into the gateway on every start, but a running
  # gateway does not re-read them; this CronJob hashes the certificate secrets
  # and restarts the StatefulSet (Backup first) when they change. Pair with
  # activeRouting so the Master only restarts once the Backup is in sync.
  restartOnRenewal:
    enabled: false
    schedule: "*/15 * * * *"
    # -- Needs /bin/sh, sha256sum and kubectl
    image: alpine/kubectl:1.34.1

affinity:
  # -- Enable or disable pod anti-affinity
  enabled: false
  # -- Type of anti-affinity: "soft" (preferred) or "hard" (required)
  type: "soft"
  # -- Topology key for anti-affinity (e.g., kubernetes.io/hostname)
  topologyKey: "kubernetes.io/hostname"

ignition:
  # -- Pod security context
  securityContext:
    runAsUser: 2003
    runAsGroup: 2003
    fsGroup: 2003
    runAsNonRoot: false

  # -- NetworkPolicy configuration
  networkPolicy:
    enabled: true
    # -- Additional ingress rules (list of NetworkPolicyIngressRule), e.g. the
    # ingress controller namespace or node CIDRs for NodePorts/load balancers
    extraIngress: []

  # -- Defines the behavior during StatefulSet upgrades.
  # Options: RollingUpdate, OnDelete
  updateStrategy:
    type: RollingUpdate

  # -- External Modules Configuration for sideloading
  externalModules:
    enabled: false
    pvcName: ""

  # -- Prometheus ServiceMonitor configuration
  serviceMonitor:
    enabled: false
    # -- Scrape interval
    interval: 30s
    # -- Metrics path
    path: /data/metrics
    # -- Additional labels for the ServiceMonitor
    additionalLabels: {}

  logging:
    # -- Log level for the Ignition Gateway (INFO, DEBUG, WARN, ERROR)
    level: "INFO"
    # -- Per-logger levels, e.g. {"gateway.SslManager": "DEBUG"}
    loggers: {}
    # -- SQLite log database maintenance; unset keys keep Ignition defaults:
    # entryLimit, maxEventsPerMaintenance, minTimeBetweenMaintenance, vacuumFrequency
    sqlite: {}
    # -- Append wrapper.logfile=/dev/stdout to args so the gateway log goes to the
    # container log (rotated by the kubelet) instead of an unrotated
    # logs/wrapper.log on the logs emptyDir
    wrapperLogToStdout: true

  # -- Web Server SSL/TLS Configuration
  ssl:
    # -- Enable custom Web Server TLS certificate
    enabled: false
    # -- Name of the secret containing the keystore.p12
    # Defaults to "<fullname>-web-tls" if not specified.
    secretName: ""

  eam:
    # -- EAM Role (Controller, Agent, Standalone)
    role: "Controller"

  # -- Resource requests and limits for the init container
  initResources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  resources:
    # -- Resource requests and limits
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  persistence:
    # -- Access modes for the PersistentVolumeClaim
    accessModes:
      - ReadWriteOnce
    # -- Size of the persistent volume
    size: 3Gi
    # -- Storage class name (set to "-" to disable dynamic provisioning or use default)
    storageClassName: ""

  # -- Additional arguments passed to the Ignition Gateway
  args:
    - -m
    - "1024"
    - -n
    - "$(GATEWAY_SYSTEM_NAME)"
    - --
    - gateway.useProxyForwardedHeader=true

  # -- Simplified project mounting.
  # Mounts local directories to /usr/local/bin/ignition/<mountPath>
  # Example:
  # - hostPath: "C:/MyProjects/SiteA"
  #   mountPath: "assets/projects/SiteA"
  localMounts: []

  # -- Environment variables for configuration (will be mapped to ConfigMap)
  config:
    IGNITION_EDITION: "standard"
    ACCEPT_IGNITION_EULA: "Y"
    DISABLE_QUICKSTART: "true"
    GATEWAY_NETWORK_SECURITYPOLICY: "Unrestricted"
    GATEWAY_NETWORK_REQUIRETWOWAYAUTH: "true"
    GATEWAY_MODULES_ENABLED: "perspective,symbol-factory,alarm-notification,modbus-driver-v2,opc-ua,reporting,siemens-drivers,sql-bridge,tag-historian,udp-tcp-drivers"

  # -- Use SealedSecrets instead of plain Kubernetes Secrets
  sealedSecrets: false

  # -- Sensitive configuration values (will be mapped to Secret/SealedSecret)
  secrets:
    GATEWAY_ADMIN_USERNAME: "admin"
    GATEWAY_ADMIN_PASSWORD: "admin"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro"
    IGNITION_WEB_KEYSTORE_PASSWORD: "ignition"

  service:
    # -- Service type (LoadBalancer, NodePort, ClusterIP)
    type: NodePort
    # -- Session affinity (ClientIP or None)
    sessionAffinity: None
    # -- Port configuration
    ports:
      http: 8088
      https: 8043
      gan: 8060
    # -- NodePort configuration (only used if type is NodePort)
    # nodePorts:
    #   http: 30088
    #   https: 30043
    #   gan: 30060
    # -- Service annotations
    # annotations: {}

  ingress:
    # -- Enable Ingress
    enabled: false
    # -- IngressClass name (e.g. contour, nginx); empty uses the cluster default
    className: ""
    # -- TLS configuration for Ingress
    tls: []
    # -- Host and path configuration for Ingress
    # hosts:
    #   - host: "ignition.local"
    #     paths:
    #       - path: /
    #         pathType: Prefix

  # -- Gateway Restore Configuration
  # To configure Database connections, MQTT clients, and other Gateway settings,
  # provide a Gateway Backup (.gwbk) file via URL or local path (if mounted).
  restore:
    # -- Enable Gateway Restore
    enabled: false
    # -- URL to download the .gwbk file from
    url: ""
    # -- OR, path to a mounted .gwbk file
    # path: ""

  # -- Redundancy-specific settings
  redundancy:
    # -- Enable redundancy (Master/Backup). If false, deploys a single Standalone node.
    enabled: false
    pingRate: 1000
    pingTimeout: 300
    pingMaxMissed: 10
    enableSsl: true
    joinWaitTime: 30000
    websocketTimeout: 10000
    syncTimeoutSecs: 60
    maxDiskMb: 100
    masterRecoveryMode: Automatic
    httpConnectTimeout: 10000
    httpReadTimeout: 60000
    backupFailoverTimeout: 10000

  # -- Route user traffic only to the Active gateway of a redundant pair
  # (needs redundancy.enabled). A labeller Deployment keeps the label
  # redundancy-active=true on the Active gateway and a <name>-active Service
  # selects it; that Service takes service.type/nodePorts/annotations, the main
  # Service becomes ClusterIP, and the Ingress points at it. Readiness then
  # also requires a Backup to be in sync, so rolling updates wait for it.
  activeRouting:
    enabled: false
    # -- Labeller image; needs /bin/sh, curl and kubectl
    image: alpine/kubectl:1.34.1
    # -- Seconds between /system/gwinfo polls
    intervalSeconds: 2
    # -- Polls to keep the label on a gateway that stops answering
    unknownHold: 3
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}

  # -- Readiness Probe configuration
  readinessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 5
    failureThreshold: 10
    timeoutSeconds: 3
    command:
      - health-check.sh
      - -t
      - "3"
      - -r

  # -- Liveness Probe configuration
  livenessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
    command:
      - health-check.sh
      - -t
      - "5"

  # -- Startup Probe configuration (off by default). While it runs, liveness and
  # readiness are held off, so livenessProbe.failureThreshold can stay low and
  # slow starts (e.g. a redundant state transfer restart) are still tolerated.
  startupProbe:
    enabled: false
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
    command:
      - health-check.sh
      - -t
      - "5"

  # -- Container lifecycle hooks (none by default: on SIGTERM the gateway shuts
  # down gracefully on its own)
  lifecycle: {}

  # -- Optional sizeLimit for the gateway emptyDir volumes, e.g. "512Mi"
  emptyDirSizeLimit:
    logs: ""
    temp: ""
    dotIgnition: ""