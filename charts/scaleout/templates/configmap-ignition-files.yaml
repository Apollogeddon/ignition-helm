apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ignition.name" . }}-config-files
  labels:
    {{- include "ignition.labels" . | nindent 4 }}
stringData:
  redundancy-primary.xml: |-
{{ include "ignition-common.redundancyXml" (dict "role" "Master" "host" (include "ignition-common.podFQDN" (dict "name" (printf "%s-backend" (include "ignition.name" .)) "ordinal" 1)) "port" (include "ignition-common.gatewayPort" "gan") "redundancy" .Values.backend.redundancy) | indent 4 }}
  redundancy-backup.xml: |-
{{ include "ignition-common.redundancyXml" (dict "role" "Backup" "host" (include "ignition-common.podFQDN" (dict "name" (printf "%s-backend" (include "ignition.name" .)) "ordinal" 0)) "port" (include "ignition-common.gatewayPort" "gan") "redundancy" .Values.backend.redundancy) | indent 4 }}

  # each layer's own logging values; the preconfigure init container installs
  # its layer's file as logback.xml
  logback-frontend.xml: |-
{{ include "ignition-common.logback" (dict "level" .Values.frontend.logging.level "loggers" .Values.frontend.logging.loggers "sqlite" .Values.frontend.logging.sqlite) | indent 4 }}
  logback-backend.xml: |-
{{ include "ignition-common.logback" (dict "level" .Values.backend.logging.level "loggers" .Values.backend.logging.loggers "sqlite" .Values.backend.logging.sqlite) | indent 4 }}
