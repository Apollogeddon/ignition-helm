apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ignition.name" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ignition.labels" $ | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "ignition requires write access"
spec:
  selector:
    matchLabels:
      {{- include "ignition.selectorLabels" . | nindent 6 }}
      {{- if .Values.componentSelectors }}
      app.kubernetes.io/component: frontend
      {{- end }}
  serviceName: {{ include "ignition.name" . }}-frontend-headless
  {{- /* the HPA owns the replica count while it is enabled; helm would reset it on every upgrade */}}
  {{- if not .Values.frontend.hpa.enabled }}
  replicas: {{ .Values.frontend.redundancy.replicas }}
  {{- end }}
  updateStrategy:
    {{- include "ignition-common.updateStrategy" (dict "values" .Values.frontend) | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "ignition.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "ignition-common.podServiceAccount" . | nindent 6 }}
      {{- include "ignition-common.podSecurityContext" (dict "values" .Values.frontend) | nindent 6 }}
      {{- include "ignition-common.affinity" (dict "affinity" .Values.affinity "context" . "component" "frontend") | nindent 6 }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      {{- include "ignition-common.gatewayContainer" (dict "image" .Values.image "values" .Values.frontend "context" .) | nindent 6 }}
        envFrom:
        - configMapRef:
            name: {{ include "ignition.name" . }}-frontend-config
        - secretRef:
            name: {{ include "ignition.name" . }}-frontend-secrets
        env:
        {{- $backendReplicas := (ternary 2 1 .Values.backend.redundancy.enabled) }}
        {{- range $i, $e := until (int $backendReplicas) }}
        - name: GATEWAY_NETWORK_{{ $i }}_HOST
          value: {{ include "ignition-common.podFQDN" (dict "name" (printf "%s-backend" (include "ignition.name" $)) "ordinal" $i) | quote }}
        {{- end }}
        - name: EAM_SETUP_INSTALLSELECTION
          value: {{ .Values.frontend.eam.role | quote }}
        # the Controller's Gateway Network name: backends are named after their
        # pod (GATEWAY_SYSTEM_NAME), and backend-0 is the Master of a redundant pair
        - name: EAM_AGENT_CONTROLLERSERVERNAME
          value: {{ printf "%s-backend-0" (include "ignition.name" .) | quote }}
        - name: GATEWAY_SYSTEM_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
{{ include "ignition-common.volumeMounts" (dict "name" (include "ignition.name" .) "values" .Values.frontend) | nindent 8 }}
        {{- include "ignition-common.containerProbes" (dict "values" .Values.frontend) | trim | nindent 8 }}
      initContainers:
{{- with include "ignition-common.initContainer.fixDataOwnership" (dict "image" .Values.image "values" .Values.frontend "context" .) }}{{ . | trim | nindent 6 }}{{ end }}
{{ include "ignition-common.initContainer.preconfigure" (dict "name" (include "ignition.name" .) "secretName" (printf "%s-frontend-secrets" (include "ignition.name" .)) "image" .Values.image "values" .Values.frontend "replicas" 1 "context" .) | nindent 6 }}
      volumes:
      - name: data
        emptyDir: {}
{{ include "ignition-common.volumes" (dict "name" (include "ignition.name" .) "values" .Values.frontend "ganTlsSecretName" (printf "%s-frontend-gan-tls" (include "ignition.name" .)) "commonScriptsConfigMapName" (include "ignition-common.scriptsName" .)) | nindent 6 }}

