{{- /* With more than one frontend gateway (or an autoscaler), a Perspective or
Vision session must stay on the gateway it started on: an unset
frontend.service.sessionAffinity becomes ClientIP then, and None otherwise */}}
{{- $frontend := deepCopy .Values.frontend }}
{{- if not $frontend.service.sessionAffinity }}
{{- $several := or $frontend.hpa.enabled (gt (int $frontend.redundancy.replicas) 1) }}
{{- $_ := set $frontend.service "sessionAffinity" (ternary "ClientIP" "None" $several) }}
{{- end }}
{{ include "ignition-common.service" (dict "name" "frontend" "values" $frontend "Release" .Release "Chart" .Chart "Values" .Values) }}
---
{{ include "ignition-common.headlessService" (dict "name" "frontend" "values" .Values.frontend "Release" .Release "Chart" .Chart "Values" .Values) }}
