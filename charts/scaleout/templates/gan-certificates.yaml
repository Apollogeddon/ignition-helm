{{- include "ignition-common.ganCA" (dict "context" .) }}
---
{{ include "ignition-common.ganCertificate" (dict "name" "frontend" "commonName" (printf "%s-frontend" (include "ignition.name" .)) "dnsNames" (list (printf "*.%s-frontend" (include "ignition.name" .))) "secretName" (include "ignition-common.secretName" (dict "name" "frontend" "values" .Values.frontend "context" .)) "context" .) }}
---
{{ include "ignition-common.ganCertificate" (dict "name" "backend" "commonName" (printf "%s-backend" (include "ignition.name" .)) "dnsNames" (list (printf "*.%s-backend" (include "ignition.name" .))) "secretName" (include "ignition-common.secretName" (dict "name" "backend" "values" .Values.backend "context" .)) "context" .) }}
