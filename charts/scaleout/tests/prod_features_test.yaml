suite: Ignition Scaleout Production Features
templates:
  - templates/frontend/hpa.yaml
  - templates/frontend/networkpolicy.yaml
  - templates/frontend/frontend-statefulset.yaml
  - templates/backend/networkpolicy.yaml
  - templates/backend/backend-statefulset.yaml
tests:
  - it: should create HPA for frontend when enabled
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef.name
          value: ignition-scaleout-frontend

  - it: should create NetworkPolicy for frontend
    template: templates/frontend/networkpolicy.yaml
    set:
      frontend:
        networkPolicy:
          enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: should not include a lifecycle hook in frontend by default
    template: templates/frontend/frontend-statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: should render a lifecycle hook in backend from values
    template: templates/backend/backend-statefulset.yaml
    set:
      backend:
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "5"]
