suite: Ignition Scaleout Restart On Renewal
templates:
  - templates/certify.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should watch each component's certificates
    set:
      certManager:
        restartOnRenewal:
          enabled: true
    asserts:
      - documentIndex: 1
        equal:
          path: rules[1].resourceNames
          value: ["ignition-scaleout-frontend", "ignition-scaleout-backend"]
      - documentIndex: 3
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TARGETS
            value: ignition-scaleout-frontend=ignition-scaleout-gan-ca,ignition-scaleout-frontend-gan-tls ignition-scaleout-backend=ignition-scaleout-gan-ca,ignition-scaleout-backend-gan-tls

  - it: should mount the scripts Secret
    set:
      certManager:
        restartOnRenewal:
          enabled: true
    asserts:
      - documentIndex: 3
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: scripts
            secret:
              secretName: ignition-scaleout-common-scripts
              defaultMode: 0755
