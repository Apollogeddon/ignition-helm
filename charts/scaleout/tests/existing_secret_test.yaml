suite: Ignition Scaleout Passwords and existingSecret
values:
  - values/required.yaml
templates:
  - templates/frontend/frontend-statefulset.yaml
  - templates/backend/backend-statefulset.yaml
  - templates/secrets.yaml
  - templates/gan-certificates.yaml
  - templates/backend/cronjobs.yaml
tests:
  - it: should refuse to render the frontend without its passwords
    template: templates/frontend/frontend-statefulset.yaml
    set:
      frontend:
        secrets:
          GATEWAY_ADMIN_PASSWORD: ""
    asserts:
      - failedTemplate:
          errorPattern: "no default passwords: set frontend.existingSecret to a Secret holding GATEWAY_ADMIN_PASSWORD, IGNITION_GAN_KEYSTORE_PASSWORD, IGNITION_WEB_KEYSTORE_PASSWORD, or set frontend.secrets.GATEWAY_ADMIN_PASSWORD \\(e.g. --set frontend.secrets.GATEWAY_ADMIN_PASSWORD=<password>, or --set frontend.existingSecret=<secret>\\)"

  - it: should refuse to render the backend without its passwords
    template: templates/backend/backend-statefulset.yaml
    set:
      backend:
        secrets:
          IGNITION_GAN_KEYSTORE_PASSWORD: ""
    asserts:
      - failedTemplate:
          errorPattern: "or set backend.secrets.IGNITION_GAN_KEYSTORE_PASSWORD"

  - it: should render only the backend's Secret when the frontend has existingSecret
    template: templates/secrets.yaml
    set:
      frontend:
        existingSecret: frontend-passwords
        secrets: &blank
          GATEWAY_ADMIN_PASSWORD: ""
          IGNITION_GAN_KEYSTORE_PASSWORD: ""
          IGNITION_WEB_KEYSTORE_PASSWORD: ""
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ignition-scaleout-backend-secrets

  - it: should read the frontend's passwords from its existingSecret
    template: templates/frontend/frontend-statefulset.yaml
    set:
      frontend:
        existingSecret: frontend-passwords
        secrets: *blank
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: frontend-passwords
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: frontend-passwords
                key: IGNITION_GAN_KEYSTORE_PASSWORD

  - it: should read the backend's passwords from its existingSecret
    template: templates/backend/backend-statefulset.yaml
    set:
      backend:
        existingSecret: backend-passwords
        secrets: *blank
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: backend-passwords
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TLS_KEYSTORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: backend-passwords
                key: IGNITION_WEB_KEYSTORE_PASSWORD

  - it: should build each keystore with its own layer's existingSecret
    template: templates/gan-certificates.yaml
    set:
      frontend:
        existingSecret: frontend-passwords
        secrets: *blank
      backend:
        existingSecret: backend-passwords
        secrets: *blank
    asserts:
      - documentIndex: 2
        equal:
          path: spec.keystores.pkcs12.passwordSecretRef.name
          value: frontend-passwords
      - documentIndex: 3
        equal:
          path: spec.keystores.pkcs12.passwordSecretRef.name
          value: backend-passwords

  - it: should rotate the backend's certificates with its existingSecret passphrase
    template: templates/backend/cronjobs.yaml
    set:
      certManager:
        rotation:
          enabled: true
      backend:
        existingSecret: backend-passwords
        secrets: *blank
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: backend-passwords
                key: IGNITION_GAN_KEYSTORE_PASSWORD

  - it: should refuse secrets values alongside existingSecret
    template: templates/backend/backend-statefulset.yaml
    set:
      backend:
        existingSecret: backend-passwords
    asserts:
      - failedTemplate:
          errorPattern: "backend.secrets.GATEWAY_ADMIN_PASSWORD is set, but backend.existingSecret \\(backend-passwords\\) replaces the chart's Secret"
