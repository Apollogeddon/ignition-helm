suite: Ignition Scaleout Frontend StatefulSet
templates:
  - templates/frontend/frontend-statefulset.yaml
tests:
  - it: should match snapshot with default values
    asserts:
      - matchSnapshot: {}

  - it: should have correct default metadata
    asserts:
      - isKind:
          of: StatefulSet
      - matchRegex:
          path: metadata.name
          pattern: -frontend$
      - equal:
          path: spec.replicas
          value: 1

  - it: should scale replicas
    set:
      frontend:
        redundancy:
          replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should spread only this release's frontends, softly by default
    release:
      name: plant
    set:
      affinity:
        enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels
          value:
            app.kubernetes.io/name: ignition-scaleout
            app.kubernetes.io/instance: plant
            app.kubernetes.io/component: frontend

  - it: should spread the frontends apart with hard anti-affinity when asked
    set:
      affinity:
        enabled: true
        type: hard
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname

  - it: should refuse an unknown affinity type
    set:
      affinity:
        enabled: true
        type: strict
    asserts:
      - failedTemplate:
          errorPattern: "affinity.type must be soft or hard, not strict"

  - it: should not mount a service account token in the frontend gateways
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should configure resources
    set:
      frontend:
        resources:
          requests:
            memory: 2Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 2Gi