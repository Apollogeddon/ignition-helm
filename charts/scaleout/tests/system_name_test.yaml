suite: Ignition Scaleout Gateway System Name
templates:
  - templates/frontend/frontend-statefulset.yaml
  - templates/backend/backend-statefulset.yaml
tests:
  - it: should define GATEWAY_SYSTEM_NAME for the frontend args
    template: templates/frontend/frontend-statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_SYSTEM_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: should define GATEWAY_SYSTEM_NAME for the backend args
    template: templates/backend/backend-statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_SYSTEM_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: should start the backend with -r and the staged backup when its restore has a source
    template: templates/backend/backend-statefulset.yaml
    set:
      backend:
        restore:
          enabled: true
          path: /restore/backup.gwbk
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: -r
      - equal:
          path: spec.template.spec.containers[0].args[1]
          value: /usr/local/bin/ignition/data/restore.gwbk

  - it: should not pass -r to the frontend when only the backend restores
    template: templates/frontend/frontend-statefulset.yaml
    set:
      backend:
        restore:
          enabled: true
          path: /restore/backup.gwbk
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: -r
