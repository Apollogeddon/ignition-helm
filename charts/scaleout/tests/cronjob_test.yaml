suite: Ignition Scaleout GAN Certificate Rotation CronJob
templates:
  - frontend/cronjobs.yaml
  - backend/cronjobs.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should mount the scripts from the Secret they are rendered as
    template: backend/cronjobs.yaml
    set:
      certManager:
        rotation:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: config-scripts
            secret:
              secretName: ignition-scaleout-common-scripts
              defaultMode: 0755

  - it: should mount the GAN CA and pass the backend's keystore passphrase
    template: backend/cronjobs.yaml
    set:
      certManager:
        rotation:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /run/secrets/ignition-gan-ca
            name: gan-ca
            readOnly: true
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: gan-ca
            secret:
              secretName: ignition-scaleout-gan-ca
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: ignition-scaleout-backend-secrets
                key: IGNITION_GAN_KEYSTORE_PASSWORD

  - it: should rotate only the backend, as the frontend's data volume is an emptyDir
    set:
      certManager:
        rotation:
          enabled: true
      frontend:
        hpa:
          enabled: true
        redundancy:
          replicas: 3
    asserts:
      - hasDocuments:
          count: 0
        template: frontend/cronjobs.yaml
      - hasDocuments:
          count: 1
        template: backend/cronjobs.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[3].persistentVolumeClaim.claimName
          value: data-ignition-scaleout-backend-0
        template: backend/cronjobs.yaml
