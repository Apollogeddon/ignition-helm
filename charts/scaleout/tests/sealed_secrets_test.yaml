suite: Ignition Scaleout SealedSecrets
templates:
  - gan-certificates.yaml
  - secrets.yaml
  - templates/frontend/frontend-statefulset.yaml
  - templates/backend/backend-statefulset.yaml
tests:
  # each SealedSecret unseals to <name>-<layer>-secrets; a separate keystore Secret would hold the ciphertext
  - it: should build each keystore with its layer's unsealed passphrase under SealedSecrets
    set:
      frontend:
        sealedSecrets: true
        secrets:
          GATEWAY_ADMIN_USERNAME: &sealed 
          GATEWAY_ADMIN_PASSWORD: *sealed
          IGNITION_GAN_KEYSTORE_PASSWORD: *sealed
          IGNITION_WEB_KEYSTORE_PASSWORD: *sealed
      backend:
        sealedSecrets: true
        secrets:
          GATEWAY_ADMIN_USERNAME: *sealed
          GATEWAY_ADMIN_PASSWORD: *sealed
          IGNITION_GAN_KEYSTORE_PASSWORD: *sealed
          IGNITION_WEB_KEYSTORE_PASSWORD: *sealed
    asserts:
      - template: gan-certificates.yaml
        hasDocuments:
          count: 4
      - template: gan-certificates.yaml
        documentIndex: 2
        equal:
          path: spec.keystores.pkcs12.passwordSecretRef
          value:
            name: ignition-scaleout-frontend-secrets
            key: IGNITION_GAN_KEYSTORE_PASSWORD
      - template: gan-certificates.yaml
        documentIndex: 3
        equal:
          path: spec.keystores.pkcs12.passwordSecretRef
          value:
            name: ignition-scaleout-backend-secrets
            key: IGNITION_GAN_KEYSTORE_PASSWORD
      - template: secrets.yaml
        documentIndex: 0
        isKind:
          of: SealedSecret
      - template: secrets.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: ignition-scaleout-frontend-secrets
      - template: secrets.yaml
        documentIndex: 1
        isKind:
          of: SealedSecret
      - template: secrets.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: ignition-scaleout-backend-secrets
      - template: templates/frontend/frontend-statefulset.yaml
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: ignition-scaleout-frontend-secrets
                key: IGNITION_GAN_KEYSTORE_PASSWORD
      - template: templates/backend/backend-statefulset.yaml
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: METRO_KEYSTORE_PASSPHRASE
            valueFrom:
              secretKeyRef:
                name: ignition-scaleout-backend-secrets
                key: IGNITION_GAN_KEYSTORE_PASSWORD

  # the controller unseals all of a SealedSecret or none of it
  - it: should refuse a default left unsealed
    template: secrets.yaml
    set:
      backend:
        sealedSecrets: true
        secrets:
          GATEWAY_ADMIN_PASSWORD: 
    asserts:
      - failedTemplate:
          errorPattern: "secrets.GATEWAY_ADMIN_USERNAME is not a kubeseal-encrypted value"

  # a YAML block scalar or --set-file from "kubeseal --raw > file" ends in a newline
  - it: should accept and trim sealed values with a trailing newline
    template: secrets.yaml
    set:
      frontend:
        sealedSecrets: true
        secrets:
          GATEWAY_ADMIN_USERNAME: "\n"
          GATEWAY_ADMIN_PASSWORD: "\n"
          IGNITION_GAN_KEYSTORE_PASSWORD: "\n"
          IGNITION_WEB_KEYSTORE_PASSWORD: "\n"
    asserts:
      - documentIndex: 0
        isKind:
          of: SealedSecret
      - documentIndex: 0
        equal:
          path: spec.encryptedData.GATEWAY_ADMIN_USERNAME
          value: 
