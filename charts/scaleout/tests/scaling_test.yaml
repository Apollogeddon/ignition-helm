suite: Ignition Scaleout Scaling, Disruption Budgets and Persistence
templates:
  - templates/frontend/hpa.yaml
  - templates/backend/hpa.yaml
  - templates/frontend/pdb.yaml
  - templates/frontend/frontend-statefulset.yaml
  - templates/backend/networkpolicy.yaml
  - templates/backend/backend-statefulset.yaml
# the frontend HPA needs component selectors (component_selector_test.yaml)
set:
  componentSelectors: true
tests:
  - it: should pass the frontend HPA's minimum replicas through
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          minReplicas: 2
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2

  - it: should not create a frontend HPA by default
    template: templates/frontend/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should scale the frontend StatefulSet on CPU by default when enabled
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: StatefulSet
            name: ignition-scaleout-frontend
      - equal:
          path: spec.maxReplicas
          value: 10
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80
      - notExists:
          path: spec.behavior

  - it: should add a memory target and render the scaling behavior as given
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          targetCPUUtilizationPercentage: ""
          targetMemoryUtilizationPercentage: 75
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 600
              policies:
                - type: Pods
                  value: 1
                  periodSeconds: 300
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 75
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 600
      - equal:
          path: spec.behavior.scaleDown.policies[0]
          value:
            type: Pods
            value: 1
            periodSeconds: 300

  - it: should refuse a frontend HPA with no utilization target
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          targetCPUUtilizationPercentage: ""
    asserts:
      - failedTemplate:
          errorPattern: "frontend.hpa needs targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage"

  - it: should refuse a frontend HPA whose minimum exceeds its maximum
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          minReplicas: 4
          maxReplicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "frontend.hpa.minReplicas must not exceed maxReplicas"

  - it: should refuse a frontend HPA minReplicas of 0 rather than replace it
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          minReplicas: 0
    asserts:
      - failedTemplate:
          errorPattern: "frontend.hpa.minReplicas must be a whole number above 0, not 0"

  - it: should refuse a frontend HPA maxReplicas of 0 rather than replace it
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          maxReplicas: 0
    asserts:
      - failedTemplate:
          errorPattern: "frontend.hpa.maxReplicas must be a whole number above 0, not 0"

  - it: should refuse a frontend HPA maxReplicas of -2 rather than replace it
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          maxReplicas: -2
    asserts:
      - failedTemplate:
          errorPattern: "frontend.hpa.maxReplicas must be a whole number above 0, not -2"

  - it: should refuse an HPA maxReplicas beyond Kubernetes' int32
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          maxReplicas: 3000000000
    asserts:
      - failedTemplate:
          errorPattern: "frontend.hpa.maxReplicas must be at most 2147483647"

  - it: should keep the HPA bounds it is given
    template: templates/frontend/hpa.yaml
    set:
      frontend:
        hpa:
          enabled: true
          minReplicas: 2
          maxReplicas: 2
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 2

  - it: should set the frontend replicas while the HPA is off
    template: templates/frontend/frontend-statefulset.yaml
    set:
      frontend:
        redundancy:
          replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should leave the frontend replicas to the HPA while it is on
    template: templates/frontend/frontend-statefulset.yaml
    set:
      frontend:
        redundancy:
          replicas: 3
        hpa:
          enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: should not create a backend HPA
    template: templates/backend/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should refuse a backend HPA, as the backend is one gateway or a redundant pair
    template: templates/backend/hpa.yaml
    set:
      backend:
        hpa:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "backend.hpa.enabled: the backend can't autoscale"

  - it: should keep the backend replicas fixed
    template: templates/backend/backend-statefulset.yaml
    set:
      backend:
        redundancy:
          enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should not create a frontend PDB for a single frontend
    template: templates/frontend/pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a frontend PDB when the frontend autoscales
    template: templates/frontend/pdb.yaml
    set:
      frontend:
        hpa:
          enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: should create a frontend PDB for more than one frontend replica
    template: templates/frontend/pdb.yaml
    set:
      frontend:
        redundancy:
          replicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: should create a NetworkPolicy for the backend when enabled
    template: templates/backend/networkpolicy.yaml
    set:
      backend:
        networkPolicy:
          enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: backend

  - it: should claim a data volume for each backend and mount it over the data directory
    template: templates/backend/backend-statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /usr/local/bin/ignition/data
            name: data
