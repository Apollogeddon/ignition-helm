name: Webpage

# Pull requests run it from .index.yaml, before the Dependabot merge.
on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webpage-${{ github.ref }}
  # never cancel a run on main, or the site is left half deployed
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the root tooling installs @apollogeddon/forgejs from GitHub Packages
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: webpage/.nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@apollogeddon"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.{md,mdx}"

  # forgejs's website pipeline: Gitleaks over the whole repository, OSV-Scanner, Biome, the
  # type check and the build, then outside pull requests the GitHub Pages deploy (and on main
  # OSV security patches). The site also serves the chart repository's index.yaml, which the
  # pre-build command copies in.
  site:
    needs: [markdown]
    uses: apollogeddon/forgejs/.github/workflows/website.yml@main
    # GitHub checks every called job's permissions, including the ones these inputs skip
    permissions:
      contents: write
      packages: read
      # Gitleaks comments on the pull request when it finds a secret
      pull-requests: write
      pages: write
      id-token: write
    with:
      working_directory: webpage
      # a pull request builds its own code; otherwise the tip of main, not the commit that
      # triggered the run: when called after release, chart-releaser has just pushed index.yaml
      ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      pre_build_command: cp ../index.yaml public/index.yaml
      run_tests: false
      # the site deploys from main; release-please versions the charts
      enable_versioning: false
      # .index.yaml asks for Dependabot's reviews and merges its pull requests
      auto_merge: false
      review_dependabot: false
