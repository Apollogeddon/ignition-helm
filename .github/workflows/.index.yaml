name: Index

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/actions/**'
      - '.github/scripts/ci/**'
      - '.github/kind/**'
      - '.github/cr.yaml'
      - '.github/release.json'
      - '.github/workflows/.index.yaml'
      - '.github/workflows/quality.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/testing.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write
  # the webpage installs @apollogeddon/forgejs from GitHub Packages
  packages: read

jobs:
  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Update Chart Dependencies
        run: sh ./.github/scripts/ci/update-dependencies.sh

      - name: Check for changes
        id: git_diff
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Changes
        if: steps.git_diff.outputs.changes_detected == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add charts/**
          if ! git diff --cached --quiet; then
            git commit -m "chore(helm): update chart lock and yaml files"
            git push
          else
            echo "No changes staged for commit."
          fi

  testing:
    needs: updates
    uses: ./.github/workflows/testing.yaml

  quality:
    needs: updates
    uses: ./.github/workflows/quality.yaml

  release:
    needs: [testing, quality]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/release.yaml
    secrets: inherit

  webpage:
    needs: release
    uses: ./.github/workflows/webpage.yaml
