name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # This job creates each chart version's tag and release, with the packaged chart
  # attached. release-please only opens the release pull requests that bump the
  # versions and changelogs: it creates no releases of its own, and expects the
  # <chart>-<version> tag names when it looks for the last release.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: ./.github/actions/setup-helm

      - name: Update dependencies
        run: sh ./.github/scripts/ci/update-dependencies.sh

      # every chart, so a version that has no release yet is released even if no
      # chart changed in this push
      - name: Package the charts
        run: ./.github/scripts/ci/package-charts.sh

      - name: Release the new chart versions
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/ci/release-charts.sh

      # chart-releaser's own upload publishes a release before attaching the chart, which
      # immutable releases refuse, so it only adds the new versions to index.yaml
      - name: Install chart-releaser
        if: steps.release.outputs.released == 'true'
        uses: helm/chart-releaser-action@v1.7.0
        with:
          install_only: true

      - name: Add the new versions to the chart index
        if: steps.release.outputs.released == 'true'
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cr-index
          cr index --owner "$GITHUB_REPOSITORY_OWNER" --git-repo "${GITHUB_REPOSITORY#*/}" \
            --package-path .cr-new-packages --pages-branch main --push

      # release-please marks a merged release pull request as released when it creates
      # the release, and opens no new one while a merged one is still pending. As
      # chart-releaser created the releases, mark it here.
      - name: Mark merged release pull requests as released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label "autorelease: pending" \
            --json number --jq '.[].number' | while read -r pr; do
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
              --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done

      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release.json
          manifest-file: .github/.release.json
