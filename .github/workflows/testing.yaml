name: Testing

on:
  workflow_call:
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      # Before "Update dependencies": that step rewrites Chart.lock when a
      # release bumps ignition-common, and chart-testing would then see every
      # chart as changed (and the release job would be skipped)
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch || 'main' }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # the charts to deploy: a change to the common library chart affects both
          deploy=$(for c in $changed; do
            case "$c" in
              charts/common) echo failover; echo scaleout ;;
              charts/*) echo "${c#charts/}" ;;
            esac
          done | sort -u | tr '\n' ' ')
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Update dependencies
        run: sh ./.github/scripts/ci/update-dependencies.sh

      - name: Install helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.7.2

      - name: Run unit tests
        run: sh ./.github/scripts/ci/run-unit-tests.sh

      - name: Run script tests
        run: for t in test/scripts/*_test.sh; do bash "$t" || exit 1; done

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        # release-please sets chart versions, and the charts list no maintainers
        run: ct lint --target-branch ${{ github.event.repository.default_branch || 'main' }} --check-version-increment=false --validate-maintainers=false

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.15.0

      # the charts create cert-manager Certificates and Issuers by default
      - name: Install cert-manager
        if: steps.list-changed.outputs.changed == 'true'
        run: ./.github/scripts/ci/install-cert-manager.sh

      # a fresh install with each chart's ci/deploy-values.yaml, checked on the
      # running gateways, then an upgrade from the default branch's chart
      - name: Deploy and check the changed charts
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHARTS: ${{ steps.list-changed.outputs.deploy }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: for c in $CHARTS; do bash ./.github/scripts/tests/deploy-test.sh "$c"; done
