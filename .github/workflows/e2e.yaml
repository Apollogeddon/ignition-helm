name: E2E

# Manual only: a full run takes about two hours
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenarios to run (test/e2e script names without .sh)
        default: s08-uncommissioned s09-wrapper-log s01-ingress-failover s06-restart-on-renewal s10-partition

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: e2e
          config: .github/kind/e2e.yaml

      - name: Install cert-manager, Contour and Chaos Mesh
        run: bash .github/scripts/e2e/setup-cluster.sh

      - name: Run scenarios
        env:
          SCENARIOS: ${{ inputs.scenarios || 's08-uncommissioned s09-wrapper-log s01-ingress-failover s06-restart-on-renewal s10-partition' }}
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: bash .github/scripts/e2e/run-scenarios.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-out
