name: E2E

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenarios to run (test/e2e script names without .sh)
        default: s8-uncommissioned s9-wrapper-log s1-ingress-failover s6-restart-on-renewal s10-partition
  schedule:
    - cron: "0 17 * * 0"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: e2e
          config: .github/kind/e2e.yaml

      - name: Install cert-manager, Contour and Chaos Mesh
        run: bash .github/scripts/e2e/setup-cluster.sh

      - name: Run scenarios
        env:
          SCENARIOS: ${{ inputs.scenarios || 's8-uncommissioned s9-wrapper-log s1-ingress-failover s6-restart-on-renewal s10-partition' }}
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: bash .github/scripts/e2e/run-scenarios.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-out
