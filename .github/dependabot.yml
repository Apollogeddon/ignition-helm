version: 2
# @apollogeddon packages come from GitHub Packages, which Dependabot can't read without a
# token, even for a public package: PACKAGES_TOKEN is a read:packages Dependabot secret.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    # No .npmrc is committed (it holds a token), so name the scope this registry serves.
    scope: "@apollogeddon"
    token: ${{ secrets.PACKAGES_TOKEN }}

updates:
  - package-ecosystem: "helm"
    directories:
      - "/charts/common"
      - "/charts/failover"
      - "/charts/scaleout"
    # Weekly and grouped: one pull request, so one CI run, for the week's updates.
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
    # Chart dependencies ship in the charts, so an update is a fix release.
    commit-message:
      prefix: "fix(deps)"
    # Wait 3 days after a version is published before proposing it, so a
    # compromised release has time to be caught/yanked upstream first.
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/webpage"
    registries:
      - npm-github
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # our own packages, apart from the rest so they never wait on a third-party update
      apollogeddon:
        patterns: ["@apollogeddon/*"]
      dependencies:
        patterns: ["*"]
    # Repository tooling and the site don't ship in the charts, so no release.
    commit-message:
      prefix: "chore(deps)"
    # astro-mermaid accepts mermaid 10 or 11 only, so a major mermaid update
    # breaks the webpage's install until astro-mermaid supports it
    ignore:
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 3
      # we published them, so the wait for a yanked release doesn't apply
      exclude: ["@apollogeddon/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    # CI deliberately tracks forgejs's reusable workflows at @main.
    ignore:
      - dependency-name: "apollogeddon/forgejs"
    cooldown:
      default-days: 3
