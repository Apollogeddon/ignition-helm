# Lefthook Configuration
# Refer to https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-commit:
  commands:
    shellcheck:
      glob: "*.sh"
      # CI runs shellcheck on every script, so the hook doesn't insist it's installed. One line and no quotes:
      # lefthook on Windows splits a quoted or multi-line command before sh -c sees it.
      run: if command -v shellcheck >/dev/null; then shellcheck {staged_files}; else echo shellcheck not installed, CI checks the scripts; fi
