# 02-high-availability.yaml
# A robust deployment for production.
# - 2 Backend nodes (Master/Backup redundancy)
# - 3 Frontend nodes (Load balanced)

frontend:
  redundancy:
    replicas: 3
  
  # Frontends are typically exposed via LoadBalancer for user access
  service:
    type: LoadBalancer
    # Sticky sessions are recommended for Perspective. ClientIP affinity can
    # send clients to a terminating pod during a rolling update; prefer
    # stickiness at the load balancer or Ingress if you have it.
    sessionAffinity: ClientIP

  # The default NetworkPolicy admits only pods in this namespace, so let the
  # LoadBalancer's clients reach the web ports (it delivers from the nodes' IPs
  # with the default externalTrafficPolicy). Narrow the CIDR to your users and nodes.
  networkPolicy:
    extraIngress:
      - from:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - protocol: TCP
            port: 8088
          - protocol: TCP
            port: 8043

  secrets:
    GATEWAY_ADMIN_PASSWORD: "strong-password"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro-password"
    IGNITION_WEB_KEYSTORE_PASSWORD: "web-password"

backend:
  # Enable Backend redundancy for tag/device stability
  redundancy:
    enabled: true
  
  # Backends typically don't need external exposure, just internal GAN access
  service:
    type: ClusterIP

  secrets:
    GATEWAY_ADMIN_PASSWORD: "strong-password"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro-password"
    IGNITION_WEB_KEYSTORE_PASSWORD: "web-password"
