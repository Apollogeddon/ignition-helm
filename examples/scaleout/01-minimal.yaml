# 01-minimal.yaml
# A basic scaleout deployment with 1 Frontend node and 1 Backend node.
# Useful for testing the architecture without the resource overhead of HA.

frontend:
  redundancy:
    replicas: 1
  service:
    type: NodePort
  # The default NetworkPolicy admits only pods in this namespace, so let the
  # nodes reach the web ports through the NodePort. Narrow the CIDR to your nodes.
  networkPolicy:
    extraIngress:
      - from:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - protocol: TCP
            port: 8088
          - protocol: TCP
            port: 8043

  secrets:
    GATEWAY_ADMIN_PASSWORD: "admin"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro"
    IGNITION_WEB_KEYSTORE_PASSWORD: "ignition"

backend:
  redundancy:
    enabled: false
  service:
    type: ClusterIP

  # IGNITION_GAN_KEYSTORE_PASSWORD must match the frontend's: both layers'
  # Gateway Network keystores are created with the frontend's value
  secrets:
    GATEWAY_ADMIN_PASSWORD: "admin"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro"
    IGNITION_WEB_KEYSTORE_PASSWORD: "ignition"
