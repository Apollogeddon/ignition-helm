# 01-minimal.yaml
# A basic scaleout deployment with 1 Frontend node and 1 Backend node.
# Useful for testing the architecture without the resource overhead of HA.

# Read and accept Inductive Automation's Ignition EULA
# (https://inductiveautomation.com/ignition/license); the charts refuse to
# render without it
acceptEula: true

frontend:
  redundancy:
    replicas: 1
  service:
    type: NodePort
  # The default NetworkPolicy admits only pods in this namespace, so let the
  # nodes reach the web ports through the NodePort. Narrow the CIDR to your nodes.
  networkPolicy:
    extraIngress:
      - from:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - protocol: TCP
            port: 8088
          - protocol: TCP
            port: 8043

  # The charts have no default passwords; set your own
  secrets:
    GATEWAY_ADMIN_PASSWORD: "strong-password"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro-password"
    IGNITION_WEB_KEYSTORE_PASSWORD: "web-password"

backend:
  redundancy:
    enabled: false
  service:
    type: ClusterIP

  # IGNITION_GAN_KEYSTORE_PASSWORD must match the frontend's: both layers'
  # Gateway Network keystores are created with the frontend's value
  secrets:
    GATEWAY_ADMIN_PASSWORD: "strong-password"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro-password"
    IGNITION_WEB_KEYSTORE_PASSWORD: "web-password"
