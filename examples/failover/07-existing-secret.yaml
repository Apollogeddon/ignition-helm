# 07-existing-secret.yaml
# Takes the gateway's passwords from a Secret you manage, so they never pass
# through Helm's values (create it by hand, from your own SealedSecret, or with
# External Secrets). Create it in the release's namespace before installing:
#
# kubectl create secret generic my-ignition-secrets \
#   --from-literal=GATEWAY_ADMIN_PASSWORD='strong-password' \
#   --from-literal=IGNITION_GAN_KEYSTORE_PASSWORD='metro-password' \
#   --from-literal=IGNITION_WEB_KEYSTORE_PASSWORD='web-password'
#
# Every key in the Secret becomes an environment variable in the gateway, so
# GATEWAY_ADMIN_USERNAME (the image defaults it to admin) and licensing keys go
# there too. The chart renders no Secret of its own, and refuses values in
# ignition.secrets, which it would otherwise ignore.

ignition:
  existingSecret: my-ignition-secrets
  # the default GATEWAY_ADMIN_USERNAME may stay; anything else here is refused
  secrets: {}
