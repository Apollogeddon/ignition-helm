# 05-restore-backup.yaml
# Fetches a Gateway Backup (.gwbk) into the data volume (/data/restore.gwbk)
# before the gateway starts.
# Useful for seeding test environments, CI pipelines, or disaster recovery.

# Read and accept Inductive Automation's Ignition EULA
# (https://inductiveautomation.com/ignition/license); the charts refuse to
# render without it
acceptEula: true

ignition:
  restore:
    enabled: true
    # URL to the backup file (must be accessible from the pod)
    # The init container downloads this file before the gateway starts.
    url: "https://example.com/backups/production-snapshot.gwbk"
    
    # Alternative: a path on a volume you mount with extraVolumes and
    # extraVolumeMounts (or localMounts); the init container mounts them too
    # path: "/mnt/backup/my-backup.gwbk"
  # extraVolumes:
  #   - name: backups
  #     persistentVolumeClaim:
  #       claimName: gateway-backups
  # extraVolumeMounts:
  #   - name: backups
  #     mountPath: /mnt/backup

  secrets:
    # NOTE: If the backup contains a stored password, it may override this!
    GATEWAY_ADMIN_PASSWORD: "strong-password"
    IGNITION_GAN_KEYSTORE_PASSWORD: "metro-password"
    IGNITION_WEB_KEYSTORE_PASSWORD: "web-password"
